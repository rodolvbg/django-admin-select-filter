[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "django-admin-select-filter"
version = "0.1.1"
description = "Select2-powered admin list filters for Django, including an async foreign-key filter."
readme = "README.md"
license = "MIT"
authors = [ { name = "Rodolfo Becerra" } ]
requires-python = ">=3.10"
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [ "django>=4.2" ]
optional-dependencies.dev = [ "django-stubs>=5", "mypy>=1.11", "pre-commit>=4", "ruff>=0.6", "tox>=4", "tox-uv>=1" ]
optional-dependencies.test = [
  "django-stubs-ext>=5",
  "inline-snapshot>=0.20.10",
  "inline-snapshot-django>=1.1",
  "playwright>=1.62",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-django>=4.8",
  "pytest-playwright>=0.9",
]
urls.Homepage = "https://github.com/rodolvbg/django-admin-select-filter"
urls.Repository = "https://github.com/rodolvbg/django-admin-select-filter"

[dependency-groups]
dev = [ "django-stubs>=5", "mypy>=1.11", "pre-commit>=4", "ruff>=0.6", "tox>=4", "tox-uv>=1" ]
test = [
  "django-stubs-ext>=5",
  "inline-snapshot>=0.20.10",
  "inline-snapshot-django>=1.1",
  "playwright>=1.62",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-django>=4.8",
  "pytest-playwright>=0.9",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/django_admin_select_filter" ]

[tool.uv]
default-groups = [ "dev", "test" ]

[tool.ruff]
target-version = "py310"
line-length = 88
lint.select = [
  "B",
  "C4",
  "E",
  "F",
  "FURB",
  "I",
  "ICN",
  "INP",
  "LOG",
  "PERF",
  "PGH004",
  "RUF",
  "SIM",
  "T20",
  "TID",
  "UP",
  "W",
]
lint.ignore = [ "B9", "E203", "E501", "E701", "RUF012", "SIM105" ]
lint.flake8-tidy-imports.ban-relative-imports = "all"

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
python_version = "3.10"
disallow_any_generics = true
check_untyped_defs = true
local_partial_types = true
enable_error_code = [
  "deprecated",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-ignore",
]
show_error_code_links = true
plugins = [ "mypy_django_plugin.main" ]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest]
ini_options.pythonpath = [ "src", "." ]
ini_options.python_files = [ "*_tests.py", "test_*.py", "tests.py" ]
ini_options.python_classes = [ "*Tests" ]
ini_options.addopts = "--reuse-db --cov=django_admin_select_filter --cov-report=term-missing"
ini_options.DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.coverage]
run.source = [ "django_admin_select_filter" ]
run.branch = true
report.skip_covered = true
report.show_missing = true

[tool.tox]
env_list = [
  "py313-dj51",
  "py312-dj42",
  "py312-dj50",
  "py310-dj42",
  "py310-dj50",
  "py310-dj51",
]
env_run_base.package = "wheel"
env_run_base.wheel_build_env = ".pkg"
env_run_base.deps = [
  "pytest",
  "pytest-django",
  "pytest-cov",
  "django-stubs-ext",
  "inline-snapshot",
  "inline-snapshot-django",
  { replace = "if", condition = "factor.dj42", then = [ "django>=4.2,<4.3" ], extend = true },
  { replace = "if", condition = "factor.dj50", then = [ "django>=5.0,<5.1" ], extend = true },
  { replace = "if", condition = "factor.dj51", then = [ "django>=5.1,<5.2" ], extend = true },
]
env_run_base.commands = [ [ "pytest", "tests", "--ignore=tests/e2e", "{posargs}" ] ]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename} -"
