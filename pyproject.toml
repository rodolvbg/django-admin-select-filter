[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-admin-select-filter"
version = "0.1.0"
description = "Select2-powered admin list filters for Django, including an async foreign-key filter."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rodolfo Becerra" }]
requires-python = ">=3.10"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["django>=4.2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4.8"]
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/rodolvbg/django-admin-select-filter"
Repository = "https://github.com/rodolvbg/django-admin-select-filter"

[tool.hatch.build.targets.wheel]
packages = ["src/django_admin_select_filter"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
