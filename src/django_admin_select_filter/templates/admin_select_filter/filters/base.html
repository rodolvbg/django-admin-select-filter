{% load i18n static %}
{{ spec.media.css }}
{% block filter_title %}
  <h3>{% blocktranslate with filter_title=title %} By {{ filter_title }} {% endblocktranslate %}</h3>
{% endblock filter_title %}
<ul>
  <li>
    <select
      class="django-admin-select-filter"
      aria-label="{{ title }}"
      data-placeholder="{% translate 'Search' %}"
      data-jquery-url="{% static 'admin/js/vendor/jquery/jquery.min.js' %}"
      data-jquery-init-url="{% static 'admin/js/jquery.init.js' %}"
      data-select2-url="{% static 'admin/js/vendor/select2/select2.full.js' %}"
      {% if spec.select2_i18n_url %}
        data-select2-i18n-url="{{ spec.select2_i18n_url }}"
        data-language="{{ spec.select2_language }}"
      {% endif %}
      data-parameter-name="{{ spec.parameter_name }}"
      {% if spec.select2_theme %}data-theme="{{ spec.select2_theme }}"{% endif %}
      {% if not spec.searchable %}data-searchable="false"{% endif %}
      {% if spec.async_call %}
        data-async-call="true"
        data-api-url="{{ spec.async_call_url }}"
        data-app-label="{{ spec.admin_app_label }}"
        data-model-name="{{ spec.admin_model_name }}"
        data-facets="{{ spec.facets|yesno:'true,false' }}"
        data-all-value="{{ spec.all_value }}"
        {% if spec.autocomplete_source %}
          data-admin-autocomplete="true"
          data-source-app-label="{{ spec.autocomplete_source.app_label }}"
          data-source-model-name="{{ spec.autocomplete_source.model_name }}"
          data-source-field-name="{{ spec.autocomplete_source.field_name }}"
          data-all-label="{% translate 'All' %}"
          {% if spec.nullable %}data-null-value="{{ spec.null_value }}"{% endif %}
        {% endif %}
      {% endif %}
      {% if spec.multiple %}
        multiple
        data-multiple="true"
        data-multiple-separator="{{ spec.multiple_separator }}"
      {% endif %}
      {% block select_attrs %}{% endblock %}
    >
      {% block options %}
        {% for choice in choices %}
          {% if not spec.multiple or choice.key %}
            <option
              data-key="{{ choice.key }}"
              value="{% if spec.multiple %}{{ choice.key }}{% else %}{{ choice.query_string|iriencode }}{% endif %}"
              {% if choice.selected %}selected{% endif %}
            >
              {{ choice.display }}
            </option>
          {% endif %}
        {% endfor %}
      {% endblock options %}
    </select>
  </li>
</ul>
{{ spec.media.js }}
