default_language_version:
  python: &python-version python3.14

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-json
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-toml
  - id: debug-statements
  - id: end-of-file-fixer
  - id: trailing-whitespace

- repo: https://github.com/biomejs/pre-commit
  rev: 9043c78f09d0d322ff458336dcb1aefcdfdbb8a0  # frozen: v2.6.3
  hooks:
  - id: biome-check
    additional_dependencies:
    - '@biomejs/biome@2.3.8'
    language_version: default

- repo: https://github.com/adamchainz/django-upgrade
  rev: 5a815b88d9286ba45b8c1a4b56e695ff5645c65e  # frozen: 1.33.0
  hooks:
  - id: django-upgrade
    args: [--target-version, "4.2"]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # frozen: v0.17.2
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format

- repo: local
  hooks:
  - id: mypy
    name: mypy
    entry: env PYTHONPATH=src mypy
    language: python
    additional_dependencies:
    - mypy>=1.11
    - django-stubs[compatible-mypy]>=5
    - django-stubs-ext>=5
    - django>=4.2
    types: [python]
    files: ^(src|tests)/
    pass_filenames: false
    args: [src/django_admin_select_filter, tests]

- repo: https://github.com/adamchainz/djade-pre-commit
  rev: 728ec80e88767be989d18b53ed47753c85f3f0b8  # frozen: 1.10.0
  hooks:
  - id: djade
    files: '(/|^)templates/'

- repo: https://github.com/tox-dev/pyproject-fmt
  rev: 50e0f3aee9dc5747a5f173f79a7417403c18dda6  # frozen: v2.30.3
  hooks:
  - id: pyproject-fmt
